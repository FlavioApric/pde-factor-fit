[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[project]
name = "pde-factor-model-expansion"
version = "0.0.1"
description = "Worked examples and out-of-class data generators for extending the factor pipeline beyond linear constant coefficients"
requires-python = ">=3.10"
dependencies = ["numpy", "sympy", "mpmath"]

[project.optional-dependencies]
dev = ["pytest"]
pipeline = ["pdefactor @ git+https://github.com/FlavioApric/pde-factor-fit@main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
