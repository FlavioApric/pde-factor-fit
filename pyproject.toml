[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdefactor"
version = "0.0.1"
description = "Reading the factor structure of a linear PDE from data: analytic core + Bayesian outer layer"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "sympy", "mpmath", "scikit-learn"]

[project.optional-dependencies]
ml = ["torch", "gpytorch", "linear_operator", "scikit-learn", "numpyro", "jax", "arviz"]
baselines = ["pysindy", "pydmd"]
dev = ["pytest", "hypothesis", "matplotlib", "pandas"]

[tool.setuptools.packages.find]
where = ["code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
