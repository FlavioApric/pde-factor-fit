name: paper

on:
  push:
    paths: ["paper/**", "code/**", "tests/**", ".github/workflows/paper.yml"]
  pull_request:
    paths: ["paper/**", "code/**", "tests/**", ".github/workflows/paper.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        paper: [structure_A, structure_B, reading_results]
    steps:
      - uses: actions/checkout@v4
      - name: Hygiene and notation checks
        run: python3 code/tools/paper_checks.py
      - name: TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-pictures lmodern cm-super latexmk
      - name: Build
        working-directory: paper
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error ${{ matrix.paper }}.tex
          if grep -E "undefined|multiply defined" ${{ matrix.paper }}.log; then echo "unresolved references"; exit 1; fi

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_core_exact.py tests/test_ml_contract.py tests/test_validate.py
