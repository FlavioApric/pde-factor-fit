name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_verification.py
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-science texlive-pictures lmodern latexmk
      - name: Build the paper and the proofs
        working-directory: paper
        run: |
          for f in analytical analytical_proofs; do
            latexmk -pdf -interaction=nonstopmode -halt-on-error $f.tex
            if grep -E "undefined|multiply defined" $f.log; then echo "unresolved references in $f"; exit 1; fi
          done
